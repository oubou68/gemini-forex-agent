<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (48x48) -->
  <g transform="translate(4, 8)">
    <rect width="48" height="48" rx="12" fill="url(#logoBg)" />
    <!-- Mini Candlesticks -->
    <rect x="10" y="28" width="3" height="10" rx="1" fill="#10b981" />
    <rect x="15" y="22" width="3" height="16" rx="1" fill="#38bdf8" />
    <rect x="20" y="16" width="3" height="22" rx="1" fill="#60a5fa" />
    <!-- Stylized 'A' -->
    <path d="M 28 10 L 38 38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 28 10 L 16 38" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Ascending Arrow -->
    <path d="M 12 34 L 21 28 L 29 31 L 39 16" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 34 15 L 40 15 L 40 21" fill="none" stroke="url(#glowLine)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="28" cy="10" r="2.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Typography Brand Text -->
  <g transform="translate(64, 34)">
    <text font-family="'Outfit', sans-serif" font-weight="900" font-size="24" letter-spacing="1.5" fill="currentColor">
      AURA <tspan fill="#0284c7">QUANT</tspan>
    </text>
    <text y="16" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="9" letter-spacing="0.8" fill="#64748b">
      DUAL ENGINE • FOREX &amp; US EQUITIES
    </text>
  </g>
</svg>
