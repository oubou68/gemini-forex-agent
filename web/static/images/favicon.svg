<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#auraBg)" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Background Chart Bars (Subtle) -->
  <rect x="13" y="36" width="4" height="12" rx="1.5" fill="#10b981" opacity="0.85" />
  <rect x="19" y="30" width="4" height="18" rx="1.5" fill="#38bdf8" opacity="0.9" />
  <rect x="25" y="24" width="4" height="24" rx="1.5" fill="#60a5fa" opacity="0.95" />

  <!-- Stylized Geometric AURA 'A' with Quantum Circuit -->
  <path d="M 34 14 L 47 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 34 14 L 20 48" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Ascending Quantum Pulse Line & Arrow -->
  <path d="M 14 42 L 26 34 L 36 38 L 48 20" fill="none" stroke="url(#auraGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 43 19 L 49 19 L 49 25" fill="none" stroke="url(#auraGlow)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Quantum Nodes -->
  <circle cx="26" cy="34" r="2.5" fill="#ffffff" />
  <circle cx="36" cy="38" r="2.5" fill="#ffffff" />
  <circle cx="34" cy="14" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
</svg>
