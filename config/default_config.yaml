app:
  name: "Gemini Dual Autonomous Trading Agent (Forex, NASDAQ & Dow Jones)"
  version: "2.1.0"

forex_trading:
  # Monitored currency pairs for intraday scanning (OANDA)
  instruments:
    - "EUR_USD"
    - "GBP_USD"
    - "USD_JPY"
    - "AUD_USD"
    - "EUR_JPY"
  
  execution_timeframe: "M5"
  context_timeframes:
    - "M15"
    - "H1"
  scan_interval_sec: 10
  strategy_mode: "gemini_hybrid"

