trading:
  instruments:
    - "EUR_USD"
    - "GBP_USD"
    - "USD_JPY"
    - "AUD_USD"
    - "EUR_JPY"
  execution_timeframe: "M5"
  context_timeframes:
    - "M15"
    - "H1"
  scan_interval_sec: 10
  strategy_mode: "gemini_hybrid"

risk:
  risk_per_trade_pct: 1.0        # Risk 1.0% of account equity per trade
  max_open_positions: 5          # Maximum concurrent open trades (Forex)
  stock_max_open_positions: 20   # Maximum concurrent open trades (Stocks)
  max_daily_drawdown_pct: 3.0    # Circuit breaker: halt trading if daily DD >= 3%
  max_spread_pips: 2.5           # Maximum allowable spread in pips (Forex)
  max_spread_dollars: 0.35       # Maximum allowable spread in USD (Stocks)
  min_risk_reward_ratio: 1.5     # Minimum RRR (TP / SL)
  default_atr_multiplier_sl: 1.5 # SL = Entry +/- (ATR * 1.5)
  default_atr_multiplier_tp: 2.5 # TP = Entry +/- (ATR * 2.5)
  breakeven_trigger_r: 1.0       # Move SL to Breakeven when 1R profit reached
  trailing_stop_enabled: true
  allow_ai_close_signals: true   # Whether Gemini AI can close positions before SL/TP
  auto_liquidate_on_drawdown: false # If false, halts new entries while letting existing trades run to SL/TP

gemini:
  model_name: "gemini-4-argon"
  temperature: 0.2
  max_tokens: 1500
  confidence_threshold: 65       # Only execute trades if Gemini confidence >= 65%
  restrict_to_trading_hours: true # Optimize token usage by restricting Gemini API calls to active market hours
  stock_regular_hours_only: false # If true, restricts stock Gemini queries strictly to 09:30-16:00 EST (RTH)

indicators:
  ema_periods: [9, 21, 50, 200]
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0
  vwap_enabled: true
  orb_minutes: 15
